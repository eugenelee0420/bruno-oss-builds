name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive tag and version
        id: derive
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"
          version="${tag#v}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Branch '$branch' does not follow release/v<major>.<minor>.<patch>"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          echo "Derived tag=$tag version=$version"

      - name: Ensure tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.derive.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to overwrite a published release"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published assets"
            exit 1
          fi

          echo "Tag and release $TAG are both absent"

  build-linux:
    name: Build Linux artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # uses the official repo
          repository: 'usebruno/bruno'
          ref: ${{ needs.validate.outputs.tag }}

      - name: Patch electron builder config
        shell: bash
        run: |
          curl -o oss-build-patch.diff https://raw.githubusercontent.com/eugenelee0420/bruno-oss-builds/refs/heads/main/config.diff
          set -euo pipefail
          git apply ./oss-build-patch.diff 
          head -n 15 packages/bruno-electron/electron-builder-config.js
          git diff

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set version="$VERSION" --workspace=packages/bruno-electron
          grep -Fq "\"version\": \"$VERSION\"" packages/bruno-electron/package.json

      - name: Verify Linux PTY binary
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f node_modules/@lydell/node-pty-linux-x64/pty.node ]; then
            echo "::error::@lydell/node-pty-linux-x64/pty.node is missing; the packaged terminal would fail"
            exit 1
          fi

      - name: Cache Electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Build renderer
        run: npm run build:web

      - name: Build Linux packages
        run: npm run build:electron:linux

      - name: Verify Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          cd packages/bruno-electron/out
          shopt -s nullglob
          appimages=( *.AppImage )
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one AppImage, found ${#appimages[@]}"
            ls -la
            exit 1
          fi
          appimage="${appimages[0]}"
          case "$appimage" in
            *"$VERSION"*) ;;
            *) echo "::error::$appimage does not contain version $VERSION"; exit 1 ;;
          esac
          case "$appimage" in
            *x86_64*) ;;
            *) echo "::error::$appimage is not an x86_64 build"; exit 1 ;;
          esac
          for other in *.deb *.rpm; do
            echo "::error::Unexpected package $other"
            exit 1
          done
          echo "Verified $appimage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: packages/bruno-electron/out/*.AppImage
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows artifacts
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      # The oss-build patch is applied with `git apply`, whose context lines are
      # LF terminated. Checkout must not rewrite them to CRLF first.
      - name: Disable Git line ending conversion
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "git config failed with exit code $LASTEXITCODE" }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw "git config failed with exit code $LASTEXITCODE" }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # uses the official repo
          repository: 'usebruno/bruno'
          ref: ${{ needs.validate.outputs.tag }}

      - name: Patch electron builder config
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/eugenelee0420/bruno-oss-builds/refs/heads/main/config.diff' -OutFile 'oss-build-patch.diff'
          git apply ./oss-build-patch.diff
          if ($LASTEXITCODE -ne 0) { throw "git apply failed with exit code $LASTEXITCODE" }
          Get-Content -Path 'packages/bruno-electron/electron-builder-config.js' -TotalCount 15
          git diff
          if ($LASTEXITCODE -ne 0) { throw "git diff failed with exit code $LASTEXITCODE" }

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: pwsh

      - name: Set release version
        shell: pwsh
        run: |
          npm pkg set "version=$env:VERSION" --workspace=packages/bruno-electron
          if ($LASTEXITCODE -ne 0) { throw "npm pkg set failed with exit code $LASTEXITCODE" }
          $expected = '"version": "' + $env:VERSION + '"'
          if (-not (Select-String -Path 'packages/bruno-electron/package.json' -Pattern $expected -SimpleMatch -Quiet)) {
            throw "packages/bruno-electron/package.json does not contain $expected"
          }

      - name: Add Windows PTY binaries
        shell: pwsh
        run: |
          npm i --no-save --force --legacy-peer-deps `
            '@lydell/node-pty-win32-x64@1.1.0' `
            '@lydell/node-pty-win32-arm64@1.1.0'
          if ($LASTEXITCODE -ne 0) { throw "npm install of node-pty binaries failed with exit code $LASTEXITCODE" }
          foreach ($binary in @('node_modules/@lydell/node-pty-win32-x64/conpty.node', 'node_modules/@lydell/node-pty-win32-arm64/conpty.node')) {
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing $binary" }
          }

      - name: Cache Electron and electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Build renderer
        shell: pwsh
        run: npm run build:web

      # Port of scripts/build-electron.sh (used by build:electron:win), which is
      # a bash script npm cannot execute on Windows.
      - name: Assemble renderer into Electron web directory
        shell: pwsh
        run: |
          $distDir = 'packages/bruno-app/dist'
          $webDir = 'packages/bruno-electron/web'

          if (-not (Test-Path -LiteralPath $distDir)) { throw "Renderer build output missing at $distDir" }

          if (Test-Path -LiteralPath 'packages/bruno-electron/out') {
            Remove-Item -LiteralPath 'packages/bruno-electron/out' -Recurse -Force
          }
          if (Test-Path -LiteralPath $webDir) {
            Remove-Item -LiteralPath $webDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $webDir -Force | Out-Null

          Copy-Item -Path "$distDir/*" -Destination $webDir -Recurse -Force

          # Serve the bundled renderer relative to the file:// URL inside the asar.
          $htmlFiles = Get-ChildItem -Path $webDir -Filter '*.html' -File
          foreach ($html in $htmlFiles) {
            $content = Get-Content -LiteralPath $html.FullName -Raw
            $content = $content.Replace('/static/', 'static/')
            Set-Content -LiteralPath $html.FullName -Value $content -NoNewline
          }

          $cssDir = Join-Path $webDir 'static/css'
          if (Test-Path -LiteralPath $cssDir) {
            foreach ($css in (Get-ChildItem -Path $cssDir -Filter '*.css' -File)) {
              $content = Get-Content -LiteralPath $css.FullName -Raw
              $content = $content.Replace('/static/font', '../../static/font')
              Set-Content -LiteralPath $css.FullName -Value $content -NoNewline
            }
          }

          $sourceMaps = Get-ChildItem -Path $webDir -Filter '*.map' -File -Recurse
          foreach ($map in $sourceMaps) { Remove-Item -LiteralPath $map.FullName -Force }

          Write-Host "Prepared $((Get-ChildItem -Path $webDir -Recurse -File).Count) renderer files in $webDir"

      - name: Build Windows installers
        shell: pwsh
        run: npm run dist:win --workspace=packages/bruno-electron

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $outDir = 'packages/bruno-electron/out'
          foreach ($arch in @('x64', 'arm64')) {
            $file = Join-Path $outDir "bruno_$($env:VERSION)_$($arch)_win.exe"
            if (-not (Test-Path -LiteralPath $file)) {
              Get-ChildItem -LiteralPath $outDir | Format-Table Name, Length | Out-String | Write-Host
              throw "Missing $file"
            }
          }
          Write-Host "Verified Windows installers for $env:VERSION"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.exe.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate, build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: dist

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published assets"
            exit 1
          fi
          shopt -s nullglob
          files=( dist/* )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded"
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_REF_NAME" \
            --title "$TAG" \
            --notes "See https://github.com/usebruno/bruno/releases/tag/$TAG" \
            "${files[@]}"
