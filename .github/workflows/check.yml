name: Check for new release

on:
  schedule:
    - cron: '37 0 * * 1'
  workflow_dispatch:

jobs:
  check:
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check latest version
        id: check_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          theirs=$(bash -c 'gh release list -q .[].tagName --json tagName -R usebruno/bruno | head -n 1')
          ours=$(bash -c 'gh release list -q .[].tagName --json tagName | head -n 1')
          if [[ "$theirs" == "$ours" ]]; then
            echo "No need to build"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Need to build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$theirs" >> "$GITHUB_OUTPUT"
          fi

          echo "ours: $ours, theirs: $theirs"

      - name: Call build workflow
        id: call_build_workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ steps.check_version.outputs.should_build == 'true' }}
        run: |
          echo "Dispatching workflow to build new release, tag=${{ steps.check_version.outputs.tag }}"
          gh workflow run release.yml \
          --repo ${{ github.repository }} \
          --ref main \
          -f tag=${{ steps.check_version.outputs.tag }}
